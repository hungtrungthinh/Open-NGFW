[package]
name = "open-ngfw"
version = "0.1.0"
edition = "2021"
description = "Open Next-Generation Firewall with web dashboard"
authors = ["Open-NGFW Team <wtf@boringlab.io>"]
license = "MIT"
keywords = ["firewall", "ngfw", "network", "security", "web", "dashboard"]
categories = ["network-programming", "web-programming"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
pnet = "0.35"
libc = "0.2"
nix = "0.27"
anyhow = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 0
debug = true 